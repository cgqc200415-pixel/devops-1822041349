
name: CI CD Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Kiem tra 3 file
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

      - name: Kiem tra the title
        run: grep -qi '<title>' index.html

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Pages
        uses: actions/configure-pages@v5

      - name: Dong goi website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
